# Netlify 배포 설정 파일

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Firebase 웹 API 키는 공개용 값이라 Netlify 비밀값 자동 검사에서 제외 (검사에 걸리면 배포가 실패함)
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDgXXmDJkj94NqbYPv7mYC82kFT7t78IXA"

# 어떤 주소로 접속해도 index.html을 보여 주어 새로고침 시 404가 나지 않도록 함
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
